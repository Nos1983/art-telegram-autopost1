name: Auto Art Poster
on:
  schedule:
    - cron: '0 */4 * * *'  # Каждые 4 часа (UTC)
  workflow_dispatch:       # Ручной запуск
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:  # ✅ Явно передаём секреты как переменные окружения
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RSS_URL: ${{ secrets.RSS_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run poster
        run: python poster.py
      - name: Commit state (optional)
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_ids.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Нет изменений для коммита"
          else
            git commit -m "Update posted IDs [skip ci]"
            git push
          fi
